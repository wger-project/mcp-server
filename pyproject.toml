[project]
name = "wger-mcp"
version = "0.2.0"
description = "MCP server exposing the wger fitness/nutrition REST API as tools, with pluggable auth"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "wger team", email = "hello@wger.de" },
]
keywords = ["wger", "mcp", "fitness", "nutrition", "workout", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # <2 is a hard requirement, not caution: mcp 2.0 removed mcp.server.fastmcp
    # (it is mcp.server.mcpserver there), so server.py does not import under it.
    "mcp[cli]>=1.12,<2",
    # Imported directly by server.py (anyio.run drives the stdio transport), so
    # declared rather than borrowed from mcp/starlette/httpx: the day one of them
    # stops depending on it, the console script dies on import. >=4.5 matches
    # mcp's own floor.
    "anyio>=4.5",
    "httpx>=0.27",
    # compat.py compares the wger version it finds against the one these
    # tools need. Declared rather than borrowed from the many dependencies
    # that already pull it, and preferred over a hand-rolled parse: wger
    # itself compares with packaging, and a version string is exactly the
    # kind of input where a five-line parser grows edge cases.
    "packaging>=23",
    "pydantic-settings>=2.4",
    # Also imported directly, by config.py and every tool module (Field,
    # validators, HttpUrl) — not just borrowed from pydantic-settings. >=2.7
    # matches that package's own floor.
    "pydantic>=2.7",
    "joserfc>=1.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "wger-api-client>=2.6.1,<3",
]

[project.scripts]
wger-mcp = "wger_mcp.server:main"

[project.urls]
Homepage = "https://github.com/wger-project/mcp-server"
Issues = "https://github.com/wger-project/mcp-server/issues"
Changelog = "https://github.com/wger-project/mcp-server/blob/master/CHANGELOG.md"
"wger server" = "https://github.com/wger-project/wger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wger_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wger_mcp",
    "tests",
    "docs",
    "compose.example.yml",
    ".env.example",
    # The Dockerfile builds from the lock file, so ship it alongside, otherwise
    # `docker build` inside an unpacked sdist fails on the missing uv.lock.
    "Dockerfile",
    "uv.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
